<style>
:root{--e:#10b981;--g:#f5c542;--s:#0b1220;--s2:#16213a;--s3:#1f2d4d;--t:#e2e8f0;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:linear-gradient(160deg,#0b1220,#0f2a2a);color:var(--t);min-height:100vh;padding-top:env(safe-area-inset-top)}
h2,h3{margin:.3em 0;color:var(--g)}small{color:#94a3b8}
.side{position:fixed;left:0;top:0;bottom:0;width:210px;background:var(--s2);padding:14px 10px;display:flex;flex-direction:column;gap:4px;border-right:1px solid #10b98155}
.side a,.bnav a{cursor:pointer;padding:10px;border-radius:10px;display:flex;gap:8px;align-items:center}.side a:hover,a.on{background:#10b98133;color:var(--g)}
.brand{display:flex;gap:8px;align-items:center;margin-bottom:10px;color:var(--g)}
.lg{width:40px;height:40px;object-fit:contain;border-radius:8px}.ph{background:var(--e);color:#04231a;display:grid;place-items:center;font-weight:700}
main{margin-left:210px;padding:16px;max-width:1000px}.top{display:flex;gap:10px;align-items:center;margin-bottom:12px;padding:10px;background:var(--s2);border-radius:14px;border:1px solid #f5c54233}.top div{display:flex;flex-direction:column}
.bnav{display:none}
.card{background:var(--s2);border:1px solid #10b98133;border-radius:14px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
input,select,textarea{width:100%;padding:9px;margin:4px 0;border-radius:9px;border:1px solid #334155;background:var(--s);color:var(--t);font:inherit}
.b{background:var(--e);color:#04231a;border:0;padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;margin:2px}.b.g{background:var(--g)}.b.r{background:#ef4444;color:#fff}.b.o{background:transparent;color:var(--t);border:1px solid #475569}.sm{padding:5px 9px;font-size:13px}
.bar{height:10px;background:var(--s);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--e),var(--g))}
.tag{padding:2px 8px;border-radius:9px;background:var(--s3);font-size:12px}.ok{background:#065f46}.no{background:#7f1d1d}
#mo{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50;padding:10px}#mo>div{background:var(--s2);border-radius:16px;padding:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto;border:1px solid var(--g)}
#ts{position:fixed;top:14px;right:14px;z-index:60}#ts div{background:var(--e);color:#04231a;padding:10px 14px;border-radius:10px;margin-bottom:6px;font-weight:600}#ts .err{background:#ef4444;color:#fff}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #334155;padding:6px;text-align:left;font-size:13px}.ar{font-size:22px;direction:rtl;font-family:serif;color:var(--g)}
.login{max-width:400px;margin:6vh auto;padding:16px}
@media(max-width:760px){.side{display:none}main{margin:0;padding:10px 10px 90px}.bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--s2);border-top:1px solid #10b98155;padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;z-index:40}.bnav a{flex-direction:column;gap:0;font-size:11px;min-width:64px;text-align:center}.bnav i{font-style:normal;font-size:20px}}

const myRom=()=>{const c=cu().classes||[];return c.length?c.filter(r=>DB.rombels.includes(r)):DB.rombels};
const inCls=id=>{const u=DB.users.find(x=>x.id===id);return u&&myRom().includes(u.rombel)};
function togClass(r){const u=cu();u.classes=u.classes||[];const i=u.classes.indexOf(r);i<0?u.classes.push(r):u.classes.splice(i,1);save()}
function dec(k,st){const s=DB.subs[k];s.status=st;s.note=$('#n_'+k).value;s.rub=readRub(k);if(st==='Disetujui'&&!s.xp2){const u=DB.users.find(x=>x.id===s.uid);if(u)addXp(u,50);s.xp2=1}save();toast('Tersimpan: '+st);render()}
function delSub(k,d){DB.subs[k].del=!!d;save();render()}
function aiR(k){const s=DB.subs[k],L=(x,a,b,c)=>x>=c?4:x>=b?3:x>=a?2:1,t=(s.text||'').length,r=(s.refl||'').length,ev=(s.files||[]).length+(safeUrl(s.url)?1:0),n=(t>0)+(ev>0)+(r>0)+(t>150);
s.rub=[L(t,1,60,150),L(r,1,40,100),L(ev,1,2,3),L(n,1,2,4)];s.note=`Saran AI: skor ${score(s.rub)}/100 berdasarkan kelengkapan teks, bukti karya, dan refleksi. Ini indikasi awal; guru menilai isi dan menyesuaikan rubrik sebelum memutuskan.`;save();render()}
async function viewF(k,i){const f=DB.subs[k].files[i];let b;try{b=await idbOp('get',f.id)}catch(e){}if(!b)return toast('File tidak ditemukan','err');const u=URL.createObjectURL(b),t=f.type||'';
const p=t.startsWith('image/')?`<img alt="" src="${u}" style="max-width:100%">`:t.startsWith('video/')?`<video src="${u}" controls style="max-width:100%"></video>`:t.startsWith('audio/')?`<audio src="${u}" controls></audio>`:t==='application/pdf'?`<iframe title="pdf" src="${u}" style="width:100%;height:60vh;border:0"></iframe>`:'<p>Pratinjau tidak tersedia untuk dokumen/Excel. Silakan unduh.</p>';
modal(`<h3>${esc(f.name)}</h3>${p}<p><a class="b g" href="${u}" download="${esc(f.name)}">⬇ Unduh</a></p>`)}
const hari=d=>['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][new Date(d+'T00:00').getDay()];
function allH(){DB.users.filter(u=>u.role==='siswa'&&u.rombel===ab.r).forEach(u=>ab.rec[u.id]='Hadir');render()}
function saveAb(){if(!ab.r)return toast('Pilih rombel','err');const S=DB.users.filter(u=>u.role==='siswa'&&u.rombel===ab.r),rec={};S.forEach(u=>rec[u.id]=ab.rec[u.id]||'Hadir');
DB.att=DB.att.filter(a=>!(a.r===ab.r&&a.d===ab.d&&a.j===ab.j));DB.att.push({r:ab.r,d:ab.d,j:ab.j,p:ab.p,h:hari(ab.d),rec});save();toast('Absensi disimpan')}
function pdfAb(){const A=DB.att.filter(a=>a.r===ab.r),S=DB.users.filter(u=>u.role==='siswa'&&u.rombel===ab.r),e=$('#pdf');
e.innerHTML=`<div style="color:#000;background:#fff;padding:12px"><h3 style="color:#000">Rekap Absensi ${esc(ab.r)}</h3><table border="1" style="font-size:10px"><tr><th>Nama</th>${A.map(a=>`<th>${esc(a.h)}<br>${esc(a.d)}<br>${esc(a.j)}</th>`).join('')}</tr>${S.map(u=>`<tr><td>${esc(u.name)}</td>${A.map(a=>`<td>${esc((a.rec[u.id]||'-')[0])}</td>`).join('')}</tr>`).join('')}</table></div>`;e.style.display='block';
html2pdf().from(e).set({filename:'rekap-absensi.pdf',jsPDF:{orientation:'landscape'}}).save().then(()=>e.style.display='none')}
function simak(id,st){const t=DB.tah.find(x=>x.id===id);t.status=st;if(st==='Lancar'){const u=DB.users.find(x=>x.id===t.uid);if(u)addXp(u,30)}save();render()}
/* Admin actions */
function upLogo(i){const f=i.files[0];if(!f)return;if(f.size>4e5)return toast('Maksimal 400 KB','err');const r=new FileReader();r.onload=()=>{DB.set.logo=r.result;save();render()};r.readAsDataURL(f)}
function addRom(r){if(r&&!DB.rombels.includes(r))DB.rombels.push(r)}
function addRows(rows,mode){const s=tab==='siswa';if(mode==='replace')DB.users=DB.users.filter(u=>u.role!==tab);let n=0;
rows.forEach((r,i)=>{const nm=String(r[0]||'').trim().slice(0,80),rb=String(r[1]||'').trim().slice(0,20);if(!nm||(i===0&&/^nama/i.test(nm))||(s&&!rb))return;if(DB.users.some(u=>u.role===tab&&u.name.toLowerCase()===nm.toLowerCase()&&(!s||u.rombel===rb)))return;
DB.users.push({id:uid(),role:tab,name:nm,rombel:s?rb:'',pass:s?'smartlms':'lms2026',xp:0});if(s)addRom(rb);n++});save();toast(n+' data diimpor');render()}
const mode=()=>document.querySelector('input[name=im]:checked').value;
function addU(){const n=$('#an').value.trim(),r=tab==='siswa'?$('#ar').value.trim():'';if(!n||(tab==='siswa'&&!r))return toast('Lengkapi data','err');addRows([[n,r]],'merge')}
function impP(){const rows=$('#ip').value.split('\n').filter(l=>l.trim()).map(l=>l.split(/\t|;|,/));addRows(rows,mode())}
function impF(i){const f=i.files[0];if(!f)return;const r=new FileReader(),m=mode();r.onload=()=>{try{const w=XLSX.read(r.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1});addRows(rows,m)}catch(e){toast('File tidak valid','err')}};r.readAsArrayBuffer(f)}
function tpl(){const c='\ufeff'+(tab==='siswa'?'Nama,Rombel\nContoh Siswa,X-1\n':'Nama\nContoh Guru\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='template-'+tab+'.csv';a.click()}
function resetPw(id){const u=DB.users.find(x=>x.id===id);u.pass=u.role==='siswa'?'smartlms':'lms2026';save();toast('Password direset ke bawaan')}
async function purge(ids){for(const k of Object.keys(DB.subs)){if(ids.includes(DB.subs[k].uid)){for(const f of DB.subs[k].files||[]){try{await idbOp('del',f.id)}catch(e){}}delete DB.subs[k]}}DB.tah=DB.tah.filter(t=>!ids.includes(t.uid));DB.users=DB.users.filter(u=>!ids.includes(u.id));save();render()}
async function wipe(ids){let n=0;for(const k of Object.keys(DB.subs)){const b=DB.subs[k];if(!ids.includes(b.uid))continue;for(const f of b.files||[]){try{await idbOp('del',f.id)}catch(e){}}
const u=DB.users.find(x=>x.id===b.uid);if(u)u.xp=Math.max(0,(u.xp||0)-(b.xp1?10:0)-(b.xp2?50:0));delete DB.subs[k];n++}save();toast(n+' pekerjaan dihapus, kembali ke awal');render()}
function resetWork(id){const ids=me.role==='siswa'?[me.id]:id?[id]:DB.users.filter(u=>u.role==='siswa'&&myRom().includes(u.rombel)).map(u=>u.id);
const n=Object.values(DB.subs).filter(b=>ids.includes(b.uid)).length;if(!n)return toast('Tidak ada pekerjaan untuk dihapus','err');
ask(`Hapus ${n} pekerjaan beserta file lampiran dan kembalikan ke status belum dikumpulkan? XP dari tugas ikut dikurangi. Tindakan ini tidak dapat dibatalkan.`,()=>wipe(ids))}
function delUser(id){ask('Hapus pengguna ini beserta datanya?',()=>purge([id]))}
function delRom(){const r=$('#dr').value;if(!r)return;ask('Hapus semua siswa di rombel '+r+'?',()=>purge(DB.users.filter(u=>u.role==='siswa'&&u.rombel===r).map(u=>u.id)))}
render();
</script></body></html>
